name: Theme validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theme-validation:
    name: P2 tests, build and Linux GScan v6
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Legacy smoke (18 cases)
        run: npm run test:smoke
      - name: Content API, SSR and tag coverage units (123 cases)
        run: npm run test:unit
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Fixture browser regressions (218 cases)
        run: npm run test:fixture-browser
      - name: Targeted table and taxonomy regressions (29 cases)
        run: npm run test:p3
      - name: Build and package theme
        run: npm run zip
      - name: Validate and extract actual ZIP
        run: python3 tests/verify-theme-zip.py dist/signal-wave-ayu.zip --extract "$RUNNER_TEMP/ayu-theme" --report dist/zip-validation.json
      - name: Linux GScan v6 on extracted ZIP
        # Same immutable Ghost 6.73.0 / GScan 6.6.1 image as the local gate.
        # This runs the checker only; no Ghost server or database is started.
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/deps,readonly"
          --mount "type=bind,source=$RUNNER_TEMP/ayu-theme,target=/theme,readonly"
          ghost@sha256:4195f6c405e40230cd10c0770425cf500c1f542a96e9f6584c11649c150e5a89
          node /deps/reports/release-gate-2026-10-31/gscan-linux.cjs
          /var/lib/ghost/current/node_modules/gscan v6
